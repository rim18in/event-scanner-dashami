<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Durga Puja Check-In Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { color-scheme: light; --brand:#7b1e32; --gold:#d9a441; --bg:#f7f2eb; }
    * { box-sizing: border-box; }
    body { margin:0; padding:20px; font-family:Arial,sans-serif; background:var(--bg); color:#242424; }
    main { width:min(100%,720px); margin:auto; }
    h1 { color:var(--brand); text-align:center; margin:8px 0 20px; }
    .panel { background:#fff; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 3px 12px #00000012; }
    .controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; text-align:left; }
    label { display:block; font-weight:700; margin-bottom:6px; }
    select,input,button { width:100%; min-height:46px; border-radius:8px; border:1px solid #aaa; padding:10px; font-size:16px; }
    button { cursor:pointer; color:#fff; background:var(--brand); border:0; font-weight:700; }
    button.secondary { background:#555; }
    #qr-reader { width:100%; }
    .result { border:2px solid; border-radius:10px; padding:18px; font-size:18px; font-weight:700; text-align:center; line-height:1.5; overflow-wrap:anywhere; }
    .result.success { background:#d4edda; color:#155724; border-color:#9fcbaa; }
    .result.error { background:#f8d7da; color:#721c24; border-color:#e5a8ae; }
    .result.info { background:#d1ecf1; color:#0c5460; border-color:#9fd2dc; }
    .result.warning { background:#fff3cd; color:#664d03; border-color:#e8cf78; }
    .details { display:grid; grid-template-columns:auto 1fr; gap:5px 12px; margin-top:12px; text-align:left; font-weight:400; }
    .details dt { font-weight:700; }
    .details dd { margin:0; }
    .note { color:#666; font-size:13px; margin:8px 0 0; }
    @media (max-width:560px) { body{padding:10px}.controls{grid-template-columns:1fr}.panel{padding:12px} }
  </style>
</head>
<body>
<main>
  <h1>Durga Puja Check-In Scanner</h1>

  <section class="panel controls" aria-label="Scanner settings">
    <div>
      <label for="eventDay">Event day</label>
      <select id="eventDay">
        <option value="Dashami">Dashami</option>
        <option value="Sasthi">Sasthi</option>
        <option value="Saptami">Saptami</option>
        <option value="Ashtami">Ashtami</option>
        <option value="Nabami">Nabami</option>
      </select>
    </div>
    <button id="startButton" type="button">Start scanner</button>
    <button id="stopButton" class="secondary" type="button" disabled>Stop scanner</button>
  </section>

  <section class="panel"><div id="qr-reader"></div></section>
  <section id="result" aria-live="assertive"></section>
</main>

<script>
  'use strict';

  const FORM_ID = '252096867246165';
  const API_BASE = 'https://eu-api.jotform.com';
  // Replace this placeholder with your Jotform API key. Visible in page source.
  const API_KEY = 'fb783ae22c46d6fb4a460753fe342dfa';

  const FIELD_IDS = Object.freeze({
    fullName: '4',
    email: '5',
    paymentMethod: '37',
    eventDays: '35',
    member: '68',
    memberType: '69',
    student: '71',
    numberOf: '77',
    timestamp: '7'
  });

  // Exact mappings recovered from the five existing scanners.
  const EVENT_CONFIG = Object.freeze({
    Dashami: { checkinField: '57', registrationPrefix: 'Dashami' },
    Sasthi:   { checkinField: '64', registrationPrefix: 'Sasthi' },
    Saptami:  { checkinField: '65', registrationPrefix: 'Saptami' },
    Ashtami:  { checkinField: '66', registrationPrefix: 'Ashtami' },
    Nabami:   { checkinField: '83', registrationPrefix: 'Nabami' }
  });

  const eventDaySelect = document.getElementById('eventDay');

  const startButton = document.getElementById('startButton');
  const stopButton = document.getElementById('stopButton');
  const resultArea = document.getElementById('result');

  let scanner = null;
  let isProcessing = false;
  let lockedDay = null;
  const scannedCodes = new Set();

  function valueOf(answers, fieldId, fallback) {
    const value = answers?.[fieldId]?.answer;
    return value === undefined || value === null || value === '' ? fallback : value;
  }

  function normalizeName(value) {
    if (value && typeof value === 'object') {
      return [value.first, value.middle, value.last].filter(Boolean).join(' ') || 'Unknown Name';
    }
    return String(value || 'Unknown Name');
  }

  function normalizeEventDays(value) {
    if (Array.isArray(value)) return value.map(String).map(v => v.trim()).filter(Boolean);
    if (typeof value === 'string') return value.split(',').map(v => v.trim()).filter(Boolean);
    return [];
  }

  function extractSubmissionId(qrData) {
    const text = String(qrData).trim();
    const patterns = [
      /submission\/(\d+)/i,
      /ID\s*:\s*(\d+)/i,
      /https?:\/\/[^\s]+\/(\d+)(?:[/?#]|$)/i,
      /^(\d+)$/
    ];
    for (const pattern of patterns) {
      const match = text.match(pattern);
      if (match) return match[1];
    }
    return null;
  }

  function showResult(title, type, lines = []) {
    resultArea.replaceChildren();
    const box = document.createElement('div');
    box.className = `result ${type}`;
    const heading = document.createElement('div');
    heading.textContent = title;
    box.appendChild(heading);
    if (lines.length) {
      const list = document.createElement('dl');
      list.className = 'details';
      for (const [label, value] of lines) {
        const dt = document.createElement('dt');
        const dd = document.createElement('dd');
        dt.textContent = label;
        dd.textContent = String(value);
        list.append(dt, dd);
      }
      box.appendChild(list);
    }
    resultArea.appendChild(box);
  }

  async function getSubmissionData(submissionId, day) {
    const url = `${API_BASE}/submission/${encodeURIComponent(submissionId)}?apiKey=${encodeURIComponent(API_KEY)}`;
    const response = await fetch(url);
    const data = await response.json();
    if (!response.ok || data.responseCode !== 200 || !data.content?.answers) {
      throw new Error('QR code not found or registration could not be loaded.');
    }

    const answers = data.content.answers;
    const config = EVENT_CONFIG[day];
    const rawDays = valueOf(answers, FIELD_IDS.eventDays, '');
    const eventDays = normalizeEventDays(rawDays);
    return {
      name: normalizeName(valueOf(answers, FIELD_IDS.fullName, 'Unknown Name')),
      email: valueOf(answers, FIELD_IDS.email, 'No Email'),
      paymentMethod: valueOf(answers, FIELD_IDS.paymentMethod, 'Not required'),
      numberOf: valueOf(answers, FIELD_IDS.numberOf, 'NA'),
      member: valueOf(answers, FIELD_IDS.member, 'No'),
      memberType: valueOf(answers, FIELD_IDS.memberType, 'NA'),
      student: valueOf(answers, FIELD_IDS.student, 'No'),
      isRegistered: eventDays.some(item => item.toLowerCase().startsWith(config.registrationPrefix.toLowerCase())),
      alreadyCheckedIn: String(valueOf(answers, config.checkinField, '')).trim().toLowerCase() === 'yes'
    };
  }

  async function updateSubmissionStatus(submissionId, day) {
    const config = EVENT_CONFIG[day];
    const url = `${API_BASE}/submission/${encodeURIComponent(submissionId)}?apiKey=${encodeURIComponent(API_KEY)}`;
    const body = new FormData();
    body.append(`submission[${config.checkinField}]`, 'Yes');
    body.append(`submission[${FIELD_IDS.timestamp}]`, new Date().toISOString());
    const response = await fetch(url, { method: 'POST', body });
    const data = await response.json();
    if (!response.ok || data.responseCode !== 200) {
      throw new Error('Failed to update the Jotform check-in status.');
    }
  }

  async function processCheckIn(submissionId, qrData) {
    if (isProcessing) return;
    isProcessing = true;
    const day = lockedDay;
    const scanKey = `${day}:${qrData}`;
    showResult(`Processing ${day} check-in…`, 'info');

    try {
      if (!EVENT_CONFIG[day]) throw new Error('Start the scanner before checking in.');
      if (scannedCodes.has(scanKey)) throw new Error(`This QR code was already scanned for ${day} in this session.`);
      const person = await getSubmissionData(submissionId, day);
      if (!person.isRegistered) throw new Error(`${person.name} is not registered for ${day}.`);
      if (person.alreadyCheckedIn) throw new Error(`${person.name} was already checked in for ${day}.`);

      await updateSubmissionStatus(submissionId, day);
      scannedCodes.add(scanKey);
      const isCash = String(person.paymentMethod).replace(/\s+/g, ' ').trim().toLowerCase() === 'cash at venue';
      showResult(isCash ? 'CHECK-IN SUCCESSFUL — COLLECT CASH' : 'CHECK-IN SUCCESSFUL', isCash ? 'warning' : 'success', [
        ['Day', day], ['Name', person.name], ['Email', person.email], ['Payment', person.paymentMethod],
        ['Number of people', person.numberOf], ['Member', person.member], ['Member type', person.memberType],
        ['Student', person.student], ['Time', new Date().toLocaleTimeString()]
      ]);
      if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('Check-in successful'));
    } catch (error) {
      showResult(error.message || 'Check-in failed. Please check manually.', 'error');
    } finally {
      window.setTimeout(() => { isProcessing = false; }, 4000);
    }
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    const submissionId = extractSubmissionId(decodedText);
    if (!submissionId) {
      isProcessing = true;
      showResult('Invalid QR code. This is not a recognized event registration.', 'error');
      window.setTimeout(() => { isProcessing = false; }, 4000);
      return;
    }
    processCheckIn(submissionId, decodedText);
  }

  async function startScanner() {
    if (!API_KEY.trim() || API_KEY === 'YOUR_JOTFORM_API_KEY') {
      showResult('Set API_KEY in index.html before starting the scanner.', 'error');
      return;
    }
    try {
      lockedDay = eventDaySelect.value;
      eventDaySelect.disabled = true;
      startButton.disabled = true;
      stopButton.disabled = false;
      scanner = new Html5QrcodeScanner('qr-reader', { fps:10, qrbox:{width:250,height:250}, aspectRatio:1 }, false);
      scanner.render(onScanSuccess, () => {});
      showResult(`Scanner ready for ${lockedDay}. Point the camera at a QR code.`, 'info');
    } catch (error) {
      await stopScanner();
      showResult(error.message || 'Unable to start the scanner. Reload the page and try again.', 'error');
    }
  }

  async function stopScanner() {
    if (scanner) {
      try { await scanner.clear(); } catch (error) { console.warn('Scanner cleanup:', error); }
      scanner = null;
    }
    lockedDay = null;
    eventDaySelect.disabled = false;
    startButton.disabled = false;
    stopButton.disabled = true;
    showResult('Scanner stopped. Choose a day and start again when ready.', 'info');
  }

  startButton.addEventListener('click', startScanner);
  stopButton.addEventListener('click', stopScanner);
  showResult('Choose the event day and start the scanner.', 'info');
</script>
</body>
</html>
